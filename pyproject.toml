[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-eval-sandbox"
version = "1.0.0"
description = "Standardized LLM benchmarks against any OpenAI-compatible endpoint"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agi-eval = "agi_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
